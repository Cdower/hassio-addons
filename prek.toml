# Configuration for prek (https://prek.j178.dev), a drop-in pre-commit runner.
#
#   prek install            # install the pre-commit and pre-push git hooks
#   prek run --all-files    # run every pre-commit hook against the whole tree
#   prek run --hook-stage manual gitleaks-history   # scan the full git history
#
# CI runs the same hooks via .github/workflows/ci.yaml, so a hook that is skipped
# locally still gates the merge. The hooks fall into three groups:
#
#   Secret scanning   gitleaks (staged changes, then the whole history on push),
#                     detect-secrets (keyword and entropy heuristics, against an
#                     audited baseline), detect-private-key, detect-aws-credentials
#   Static analysis   ruff and bandit (Python), shellcheck (shell), hadolint
#                     (Dockerfiles), actionlint and zizmor (GitHub workflows),
#                     yamllint (YAML)
#   Hygiene           the pre-commit-hooks checks for file problems

default_install_hook_types = ["pre-commit", "pre-push"]
# Hooks run on commit unless they say otherwise; only gitleaks-history opts
# into the pre-push stage.
default_stages = ["pre-commit"]

# ---------------------------------------------------------------------------
# Secret scanning
# ---------------------------------------------------------------------------

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # "v8.30.1"

# Scans the staged diff with the default rules plus .gitleaks.toml.
[[repos.hooks]]
id = "gitleaks"
stages = ["pre-commit"]

[[repos]]
repo = "local"

# Scans every commit in the repository, not just the staged diff, so a secret
# that was committed with the hooks bypassed (or before they existed) is caught
# before it leaves the machine. CI runs the same hook with the full history
# checked out.
[[repos.hooks]]
id = "gitleaks-history"
name = "gitleaks (full history)"
language = "golang"
# The module keeps its pre-rename import path.
additional_dependencies = ["github.com/zricethezav/gitleaks/v8@v8.30.1"]
entry = "gitleaks git --no-banner --redact --verbose"
pass_filenames = false
always_run = true
stages = ["pre-push", "manual"]

[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "01886c8a910c64595c47f186ca1ffc0b77fa5458" # "v1.5.0"

# Heuristic scanner (keywords such as `password =`, high-entropy strings).
# Anything it already knows about is listed in .secrets.baseline; refresh the
# baseline with `detect-secrets scan --baseline .secrets.baseline` after
# confirming a new hit is a false positive.
[[repos.hooks]]
id = "detect-secrets"
args = ["--baseline", ".secrets.baseline"]

# ---------------------------------------------------------------------------
# Static analysis
# ---------------------------------------------------------------------------

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c" # "v0.17.3"

[[repos.hooks]]
id = "ruff-check"

[[repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "92ae8b82fb422a639f0ed8d99e96cea769594e08" # "1.9.4"

# Python security linter. Medium severity and up; a finding that is a deliberate
# choice carries an inline `# nosec Bxxx` with the reason next to it.
[[repos.hooks]]
id = "bandit"
args = ["--severity-level", "medium", "--quiet"]
exclude = '/tests/'

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "745eface02aef23e168a8afb6b5737818efbea95" # "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
args = ["--shell=bash"]
# init-cwa-paths uses `#!/command/with-contenv bashio`, which identify doesn't
# recognise as a shell shebang, so match by path instead of relying on type
# detection. Covers any future .sh files plus extension-less scripts under
# s6-overlay/scripts/.
types = ["file"]
files = '(\.sh$|/s6-overlay/scripts/[^/]+$)'

[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "6e7504451511eaeb62a3e7f14d63b0296cbf86eb" # "v2.15.1"

[[repos.hooks]]
id = "hadolint"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # "v1.7.12"

[[repos.hooks]]
id = "actionlint"

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f" # "v1.31.1"

# Security audit of the GitHub Actions workflows (injection, unpinned actions,
# credential persistence, ...).
[[repos.hooks]]
id = "zizmor"

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "cba56bcde1fdd01c1deb3f945e69764c291a6530" # "v1.38.0"

[[repos.hooks]]
id = "yamllint"
args = ["--strict"]

# ---------------------------------------------------------------------------
# Hygiene
# ---------------------------------------------------------------------------

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # "v6.0.0"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "detect-aws-credentials"
args = ["--allow-missing-credentials"]

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=512"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "forbid-submodules"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
