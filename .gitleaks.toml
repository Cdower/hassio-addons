# Gitleaks configuration (https://github.com/gitleaks/gitleaks#configuration).
# prek runs gitleaks on staged changes before every commit and on the full
# history before every push; CI scans the full history again (see
# .github/workflows/ci.yaml). This file only adds an allowlist on top of the
# default rules, so new rule releases are picked up automatically.

title = "hassio-addons"

[extend]
useDefault = true

[allowlist]
description = "Values that look like credentials but are not"
paths = [
  # detect-secrets' baseline stores SHA-1 hashes of the strings it has already
  # classified, which gitleaks' generic rule mistakes for API keys.
  '''^\.secrets\.baseline$''',
]
regexes = [
  # The AC Pro device key used by acpro-thermostat's unit tests. It is a made-up
  # 16-byte AES-128 key for a fake control; the real key is per device and is
  # never stored in this repository.
  '''St8Vw1Yz4Bc7Ted6''',
]
