---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
      - cwa-init
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover add-ons
    runs-on: ubuntu-26.04-arm
    outputs:
      addons: ${{ steps.discover.outputs.addons }}
      builds: ${{ steps.discover.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: List add-ons and their architectures
        id: discover
        run: |
          addons=$(
            find . -mindepth 2 -maxdepth 2 -name config.yaml -printf '%h\n' \
              | sed 's|^\./||' \
              | sort \
              | jq --raw-input --slurp --compact-output \
                  'split("\n") | map(select(length > 0))'
          )
          if [[ "${addons}" == "[]" ]]; then
            echo "::error::No add-on configuration files found"
            exit 1
          fi
          echo "addons=${addons}" >> "$GITHUB_OUTPUT"

          builds=$(
            for addon in $(jq --raw-output '.[]' <<< "${addons}"); do
              yq --no-colors --output-format json eval '.arch' "${addon}/config.yaml" \
                | jq --compact-output --arg addon "${addon}" \
                    '.[] | {addon: $addon, architecture: .}'
            done | jq --slurp --compact-output '.'
          )
          echo "builds=${builds}" >> "$GITHUB_OUTPUT"
      - name: Check the Release workflow offers every add-on
        env:
          WORKFLOW: .github/workflows/release.yaml
        run: |
          slugs=$(
            find . -mindepth 2 -maxdepth 2 -name config.yaml -print0 \
              | xargs -0 yq --no-colors --output-format json eval '.slug' \
              | jq --slurp --compact-output 'sort'
          )
          options=$(
            yq --no-colors --output-format json \
              eval '.on.workflow_dispatch.inputs.addon.options' "${WORKFLOW}" \
              | jq --compact-output 'sort'
          )
          if [[ "${slugs}" != "${options}" ]]; then
            echo "::error file=${WORKFLOW}::The addon dropdown lists ${options}," \
                 "but the add-on slugs are ${slugs}. Update its options."
            exit 1
          fi
          echo "Release dropdown matches the add-on slugs: ${slugs}"

  lint-app:
    name: Lint App (${{ matrix.addon }})
    needs: discover
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Add-on Lint
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb  # v2.21.0
        with:
          community: false
          path: "./${{ matrix.addon }}"

  lint-prek:
    name: Prek
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout (full history, for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run prek hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        env:
          # Lets zizmor run its online audits (known-vulnerable and stale
          # action pins); without a token it falls back to offline mode.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The pre-commit gitleaks hook only sees the staged diff; this scans
      # every commit (see gitleaks-history in prek.toml).
      - name: Scan the full git history for secrets
        run: prek run --hook-stage manual gitleaks-history

  test-app:
    name: Test App
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Keep in step with the uv stage in the add-ons' Dockerfiles. uv
          # also provides the Python the tests run on, from each add-on's
          # .python-version (match the Python shipped by the add-on base
          # images, see the Dockerfiles, and target-version in ruff.toml).
          version: "0.13.6"
          enable-cache: true
      - name: Run add-on tests
        run: |
          shopt -s nullglob
          suites=(*/tests)
          if [[ ${#suites[@]} -eq 0 ]]; then
            echo "::error::No add-on test suites found"
            exit 1
          fi
          for suite in "${suites[@]}"; do
            addon="${suite%/tests}"
            echo "::group::${addon}"
            # uv.lock's runtime dependencies plus the add-on's `test` group
            # (pytest and whatever the base image ships that the tests need),
            # in the add-on's own virtual environment.
            uv run --project "${addon}" --frozen --group test \
              pytest "${suite}" -v
            echo "::endgroup::"
          done

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.architecture }})
    needs:
      - discover
      - lint-app
      - lint-prek
      - test-app
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read addon information
        id: info
        uses: frenck/action-addon-information@ce1377e9851cf569c29329e65fb2c57e67ca0f69  # v1.4.2
        with:
          path: "./${{ matrix.addon }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Compose build flags
        id: flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_FILE: ${{ steps.info.outputs.build }}
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          from=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" "${BUILD_FILE}")
          echo "from=${from}" >> "$GITHUB_OUTPUT"
          case "${ARCHITECTURE}" in
            amd64)   echo "platform=linux/amd64"    >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported architecture ${ARCHITECTURE}"; exit 1 ;;
          esac
      - name: Build (smoke test, no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          push: false
          context: ${{ steps.info.outputs.target }}
          file: ${{ steps.info.outputs.target }}/Dockerfile
          platforms: ${{ steps.flags.outputs.platform }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.architecture }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ steps.info.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ steps.info.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=ci

  # The single check branch protection requires. Everything above reaches main
  # through this job, so the gated set is maintained here in code rather than as
  # a list of job names typed into the repository settings -- add-ons can come
  # and go, and the matrices can grow, without anyone touching the console.
  ci:
    name: CI
    # Runs even when something upstream fails: without this the job would be
    # skipped, and GitHub counts a skipped required check as a passing one.
    if: always()
    needs:
      - discover
      - lint-app
      - lint-prek
      - test-app
      - build
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check that this job gates every other job
        env:
          WORKFLOW: .github/workflows/ci.yaml
        run: |
          all=$(yq --no-colors --output-format json eval '.jobs | keys' "${WORKFLOW}")
          gated=$(yq --no-colors --output-format json eval '.jobs.ci.needs' "${WORKFLOW}")
          ungated=$(
            jq --raw-output --argjson gated "${gated}" \
               '. - $gated - ["ci"] | join(", ")' <<< "${all}"
          )
          if [[ -n "${ungated}" ]]; then
            echo "::error file=${WORKFLOW}::${ungated} is not listed in the CI" \
                 "job's needs, so branch protection would not enforce it."
            exit 1
          fi
          echo "CI gates every other job in ${WORKFLOW}"
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::CI is not green: a job reported '${result}'"
              exit 1
            fi
          done
