---
name: Deploy

# Publishes exactly one add-on. Releases are per add-on and are tagged
# `<slug>-v<version>` (e.g. `calibre-web-automated-v4.0.6.10`) so that
# releasing one add-on never re-pushes another one's images. See RELEASING.md.

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      addon:
        description: Add-on slug to publish
        required: true
        type: string
      version:
        description: Version override (defaults to the add-on's config.yaml version)
        required: false
        type: string
      ref:
        description: Git ref or SHA to build (defaults to the triggering ref)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on slug to publish
        required: true
        type: string
      version:
        description: Version override (defaults to the add-on's config.yaml version)
        required: false
        type: string
      ref:
        description: Git ref or SHA to build (defaults to the triggering ref)
        required: false
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.addon || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Resolve add-on
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      addon: ${{ steps.resolve.outputs.addon }}
      slug: ${{ steps.resolve.outputs.slug }}
      version: ${{ steps.resolve.outputs.version }}
      builds: ${{ steps.resolve.outputs.builds }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve the add-on and version to publish
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_ADDON: ${{ inputs.addon }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Index every add-on in the repo by directory and by slug.
          dirs=()
          slugs=()
          while IFS= read -r config; do
            dir="${config%/config.yaml}"
            slug=$(yq --no-colors --exit-status eval '.slug' "${config}")
            dirs+=("${dir}")
            slugs+=("${slug}")
          done < <(find . -mindepth 2 -maxdepth 2 -name config.yaml -printf '%P\n' | sort)

          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "::error::No add-on configuration files found"
            exit 1
          fi

          index=-1
          if [[ -n "${INPUT_ADDON}" ]]; then
            # Explicit request: accept either the directory or the slug.
            for i in "${!dirs[@]}"; do
              if [[ "${INPUT_ADDON}" == "${dirs[i]}" || "${INPUT_ADDON}" == "${slugs[i]}" ]]; then
                index=$i
                break
              fi
            done
            if [[ ${index} -lt 0 ]]; then
              echo "::error::Unknown add-on '${INPUT_ADDON}'. Known slugs: ${slugs[*]}"
              exit 1
            fi
          elif [[ -n "${RELEASE_TAG}" ]]; then
            # Release tags name their add-on: `<slug>-v<version>`. Match the
            # longest slug so that slugs sharing a prefix stay unambiguous.
            for i in "${!slugs[@]}"; do
              if [[ "${RELEASE_TAG}" == "${slugs[i]}-v"* ]]; then
                if [[ ${index} -lt 0 || ${#slugs[i]} -gt ${#slugs[index]} ]]; then
                  index=$i
                fi
              fi
            done
            if [[ ${index} -lt 0 ]]; then
              echo "::error::Release tag '${RELEASE_TAG}' does not name an add-on."
              echo "::error::Tag releases as <slug>-v<version>, one of: ${slugs[*]/%/-v<version>}"
              exit 1
            fi
          else
            echo "::error::No add-on to publish: not a release event and no addon input given"
            exit 1
          fi

          addon="${dirs[index]}"
          slug="${slugs[index]}"
          config_version=$(yq --no-colors --exit-status eval '.version' "${addon}/config.yaml")

          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${config_version}"
          fi

          # The Supervisor pulls the image tag named by the add-on's own
          # config.yaml, so a release tag that disagrees with it would publish
          # images nobody can install. Fail loudly instead.
          if [[ -n "${RELEASE_TAG}" && -z "${INPUT_VERSION}" ]]; then
            tag_version="${RELEASE_TAG#"${slug}-v"}"
            if [[ "${tag_version}" != "${config_version}" ]]; then
              echo "::error::Release tag '${RELEASE_TAG}' is version '${tag_version}'," \
                   "but ${addon}/config.yaml is '${config_version}'."
              echo "::error::Bump config.yaml to match the tag, or re-run this workflow" \
                   "manually with a version override."
              exit 1
            fi
          fi

          builds=$(
            yq --no-colors --output-format json eval '.arch' "${addon}/config.yaml" \
              | jq --compact-output --arg addon "${addon}" \
                  '[.[] | {addon: $addon, architecture: .}]'
          )

          {
            echo "addon=${addon}"
            echo "slug=${slug}"
            echo "version=${version}"
            echo "builds=${builds}"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing ${slug} ${version} (${addon})" >> "$GITHUB_STEP_SUMMARY"
      - name: Lowercase repo owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & push ${{ matrix.addon }} (${{ matrix.architecture }})
    needs: discover
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read addon information
        id: info
        uses: frenck/action-addon-information@ce1377e9851cf569c29329e65fb2c57e67ca0f69 # v1.4.2
        with:
          path: "./${{ matrix.addon }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Compose build flags
        id: flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_FILE: ${{ steps.info.outputs.build }}
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          from=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" "${BUILD_FILE}")
          echo "from=${from}" >> "$GITHUB_OUTPUT"
          case "${ARCHITECTURE}" in
            amd64)   echo "platform=linux/amd64"    >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported architecture ${ARCHITECTURE}"; exit 1 ;;
          esac
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          push: true
          tags: |
            ghcr.io/${{ needs.discover.outputs.owner }}/${{ matrix.architecture }}-hassio-addon-${{ steps.info.outputs.slug }}:${{ needs.discover.outputs.version }}
            ghcr.io/${{ needs.discover.outputs.owner }}/${{ matrix.architecture }}-hassio-addon-${{ steps.info.outputs.slug }}:latest
          # zizmor: ignore[template-injection] - path input to action, not shell-executed
          context: ${{ steps.info.outputs.target }}
          file: ${{ steps.info.outputs.target }}/Dockerfile
          platforms: ${{ steps.flags.outputs.platform }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.architecture }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ steps.info.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ steps.info.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.discover.outputs.version }}
