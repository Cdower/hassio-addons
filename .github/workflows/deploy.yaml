---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on slug to publish (defaults to every add-on)
        required: false
        type: string
      version:
        description: Version override (defaults to each add-on's config.yaml version)
        required: false
        type: string

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover add-ons
    # Forks publish nothing. Without this, a fork owner cutting a release --
    # or dispatching this workflow -- builds and pushes images to their own
    # GHCR namespace. Gating the first job is enough: `deploy` needs it, so a
    # skip here skips the whole workflow.
    if: github.repository == 'Cdower/hassio-addons'
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.discover.outputs.builds }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: List add-ons and their architectures
        id: discover
        env:
          ONLY_ADDON: ${{ inputs.addon }}
        run: |
          addons=$(
            find . -mindepth 2 -maxdepth 2 -name config.yaml -printf '%h\n' \
              | sed 's|^\./||' \
              | sort \
              | jq --raw-input --slurp --compact-output \
                  --arg only "${ONLY_ADDON}" \
                  'split("\n")
                   | map(select(length > 0))
                   | if $only == "" then . else map(select(. == $only)) end'
          )
          if [[ "${addons}" == "[]" ]]; then
            echo "::error::No add-on matched ${ONLY_ADDON:-<all>}"
            exit 1
          fi

          builds=$(
            for addon in $(jq --raw-output '.[]' <<< "${addons}"); do
              yq --no-colors --output-format json eval '.arch' "${addon}/config.yaml" \
                | jq --compact-output --arg addon "${addon}" \
                    '.[] | {addon: $addon, architecture: .}'
            done | jq --slurp --compact-output '.'
          )
          echo "builds=${builds}" >> "$GITHUB_OUTPUT"
      - name: Lowercase repo owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & push ${{ matrix.addon }} (${{ matrix.architecture }})
    needs: discover
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read addon information
        id: info
        uses: frenck/action-addon-information@ce1377e9851cf569c29329e65fb2c57e67ca0f69 # v1.4.2
        with:
          path: "./${{ matrix.addon }}"
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ADDON_VERSION: ${{ steps.info.outputs.version }}
        run: |
          # The Supervisor pulls the image tag named by the add-on's own
          # config.yaml, so that version -- not the release tag -- is what has
          # to be published. An explicit override is honoured for re-releases.
          if [[ -n "${INPUT_VERSION}" ]]; then
            v="${INPUT_VERSION}"
          else
            v="${ADDON_VERSION}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Compose build flags
        id: flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_FILE: ${{ steps.info.outputs.build }}
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          from=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" "${BUILD_FILE}")
          echo "from=${from}" >> "$GITHUB_OUTPUT"
          case "${ARCHITECTURE}" in
            amd64)   echo "platform=linux/amd64"    >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported architecture ${ARCHITECTURE}"; exit 1 ;;
          esac
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          push: true
          tags: |
            ghcr.io/${{ needs.discover.outputs.owner }}/${{ matrix.architecture }}-hassio-addon-${{ steps.info.outputs.slug }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ needs.discover.outputs.owner }}/${{ matrix.architecture }}-hassio-addon-${{ steps.info.outputs.slug }}:latest
          # zizmor: ignore[template-injection] - path input to action, not shell-executed
          context: ${{ steps.info.outputs.target }}
          file: ${{ steps.info.outputs.target }}/Dockerfile
          platforms: ${{ steps.flags.outputs.platform }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.architecture }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ steps.info.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ steps.info.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
