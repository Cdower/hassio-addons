---
name: Dependabot watch

# Reports Dependabot updates that failed or stopped running. Neither opens a
# PR or sends a notice, so a dependency can sit unpatched while everything
# looks quiet: the uv updates for calibre-web-automated failed every week for
# three weeks before anyone looked. Dependabot checks on Mondays; this runs
# the day after and, for each update in .github/dependabot.yml (one per
# ecosystem and directory, or directories), fails with a link to its latest
# run if that run failed, or names it if it did not run at all in the last 8
# days. An update added since the previous check is let off until it has had
# a weekly check of its own. GitHub mails the repository owner when a
# scheduled workflow fails. The matching is in
# .github/scripts/dependabot-watch.py, with how Dependabot names its runs.
#
# Find the reason in the failing run's log (Insights -> Dependency graph ->
# Dependabot shows the same runs), fix it, and re-run that update from there.
# For an update that did not run, check that .github/dependabot.yml is valid
# and that Dependabot still lists the update there.

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "47 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-watch
  cancel-in-progress: true

jobs:
  watch:
    name: Check the latest Dependabot runs
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: read  # to list Dependabot's runs
      contents: read  # to read .github/dependabot.yml and its history
    steps:
      # The whole history, for .github/dependabot.yml as it stood when the
      # window opened (see below).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for failed and missing update runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          since=$(date --utc --date='8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Dependabot's runs are "dynamic" workflow runs. Newest first, so
          # the first run the script sees for each update is its latest.
          gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            --raw-field event=dynamic --raw-field "created=>=${since}" --raw-field per_page=100 \
            --jq '.workflow_runs[]
                  | select(.path == "dynamic/dependabot/dependabot-updates")
                  | select(.status == "completed")
                  | [.name, .conclusion, .html_url]
                  | @tsv' > "${RUNNER_TEMP}/runs.tsv"

          yq --no-colors --output-format json eval '.' .github/dependabot.yml \
            > "${RUNNER_TEMP}/config.json"
          # A new update has no run until Dependabot's next weekly check, so
          # one may legitimately be missing from the window. Comparing with
          # the file as it stood when the window opened tells such an update
          # from one that stopped running: anything already there then has
          # had a full week to run. Taking the file's state, not when each
          # entry was written, also keeps a reshaped entry (two docker
          # entries folded into one with `directories:`) checked throughout.
          previous=$(git rev-list -1 --before="${since}" HEAD)
          if [[ -n "${previous}" ]] \
            && git cat-file -e "${previous}:.github/dependabot.yml" 2>/dev/null; then
            git show "${previous}:.github/dependabot.yml" \
              | yq --no-colors --output-format json eval '.' - > "${RUNNER_TEMP}/previous.json"
          else
            echo '{}' > "${RUNNER_TEMP}/previous.json"
          fi

          python3 -I .github/scripts/dependabot-watch.py "${RUNNER_TEMP}/config.json" \
            "${RUNNER_TEMP}/previous.json" "${RUNNER_TEMP}/runs.tsv"
