---
name: Calibre-Web Automated
version: "4.1.48.1"
# version: "dev"
slug: calibre-web-automated
description: Self-hosted ebook library with automatic ingest, conversion, and metadata
url: https://github.com/Cdower/hassio-addons/tree/main/calibre-web-automated
arch:
  - amd64
  - aarch64
init: false
webui: "http://[HOST]:[PORT:8083]/"
ports:
  "8083/tcp": 8083
  "8085/tcp": null
ports_description:
  "8083/tcp": Web UI
  "8085/tcp": >-
    Cloudflare Access entry point (JWT-validated). Leave unmapped — the
    cloudflared add-on reaches it over the internal docker network.
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  # Mounted at /addon_config because CWA itself uses /config. Part of the
  # add-on's backups; holds the shipped library, ingest and plugins folders.
  - type: addon_config
    read_only: false
    path: /addon_config
# SYS_ADMIN makes the mounts in init-cwa-paths. DAC_READ_SEARCH is only for
# mount.cifs (`smb_share`): it puts the capability back into its own set while
# dropping privileges, which fails if the container was never given it.
# apparmor.txt denies actually using it.
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
# Seconds Home Assistant waits for the add-on to stop before killing it
# (default 10). The stop has to fit CWA shutting down and then
# metadata_db_export's final copy of metadata.db to the NAS; s6's own budget
# for that is S6_SERVICES_GRACETIME in the Dockerfile.
timeout: 30
image: ghcr.io/cdower/{arch}-hassio-addon-calibre-web-automated
options:
  library_path: /addon_config/calibre-library
  ingest_path: /addon_config/cwa-book-ingest
  plugins_path: /addon_config/plugins
  metadata_db_export: false
  network_share_mode: false
  hardcover_token: ""
  trusted_proxy_count: 1
  log_level: info
  cloudflare_team_domain: ""
  cloudflare_access_aud: ""
  access_users: []
  tailscale_authkey: ""
  tailscale_hostname: ""
  tailscale_serve: true
  tailscale_funnel: false
  tailscale_extra_args: ""
schema:
  library_path: str
  books_path: str?
  metadata_db_export: bool
  ingest_path: str
  config_path: str?
  plugins_path: str?
  metadata_providers_path: str?
  smb_share: match(^//[^/]+/[^/].*$)?
  smb_username: str?
  smb_password: password?
  smb_domain: str?
  smb_version: list(3.1.1|3.0|2.1)?
  network_share_mode: bool
  hardcover_token: password?
  trusted_proxy_count: int(1,10)
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  cloudflare_team_domain: str?
  cloudflare_access_aud: password?
  access_users:
    - email
  tailscale_authkey: password?
  tailscale_hostname: str?
  tailscale_serve: bool
  tailscale_funnel: bool
  tailscale_extra_args: str?
# Backups run while CWA keeps running. backup_pre snapshots every SQLite
# database in /data and /addon_config with SQLite's backup API; on start after
# a restore those snapshots replace the possibly torn live files. See
# rootfs/opt/cwa-backup/db_snapshot.py.
backup_pre: /lsiopy/bin/python3 /opt/cwa-backup/db_snapshot.py create
backup_post: /lsiopy/bin/python3 /opt/cwa-backup/db_snapshot.py discard
backup_exclude:
  - "*/cwa.log"
  - "*/processed_books/*"
  - "*.cwa-snapshot.tmp"
