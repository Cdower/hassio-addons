# nginx config used ONLY when Cloudflare Access mode is enabled
# (cloudflare_team_domain + cloudflare_access_aud set). CWA itself is pinned
# to 127.0.0.1:8084 in that mode, so these two listeners are the only ways in:
#
#   :8083  LAN listener (host-mapped) — password login, auth headers stripped
#   :8085  Cloudflare Access listener (docker network only) — JWT-gated
#
# Static on purpose: the team domain / AUD live only in the verifier's env.

user www-data;
worker_processes 2;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log off;

    client_max_body_size 0;        # book uploads can be huge
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;   # stream large uploads straight through

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream cwa {
        server 127.0.0.1:8084;
    }

    # ---- LAN listener: password login, exactly as without nginx ----
    server {
        listen 8083 default_server;

        location / {
            proxy_pass http://cwa;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            # Do NOT chain the client-supplied X-Forwarded-For: rewrite it to
            # the direct peer, so a trusted_proxy_count raised for the
            # Cloudflare path can never be exploited from the LAN.
            proxy_set_header X-Forwarded-For $remote_addr;
            # Strip auth-bearing headers — LAN clients must not impersonate.
            proxy_set_header X-Remote-User "";
            proxy_set_header Cf-Access-Jwt-Assertion "";
            proxy_set_header Cf-Access-Authenticated-User-Email "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ---- Cloudflare Access listener: cloudflared add-on targets this ----
    server {
        listen 8085 default_server;

        location = /_cwa_access_verify {
            internal;
            proxy_pass http://127.0.0.1:8086/;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        }

        location / {
            auth_request /_cwa_access_verify;
            auth_request_set $cwa_verified_user $upstream_http_x_verified_user;

            proxy_pass http://cwa;
            # Log the validated user in via CWA's reverse-proxy header login.
            proxy_set_header X-Remote-User $cwa_verified_user;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        error_page 401 = @deny;
        location @deny {
            default_type text/plain;
            return 401 "Cloudflare Access token missing or invalid\n";
        }
    }
}
