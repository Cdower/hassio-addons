# Test environment for the Sleeptracker custom integration
# (custom_components/sleeptracker), managed with uv like the add-ons'.
# uv.lock pins every package and its hashes; refresh it with `uv lock` after
# editing this file. Run the tests from the repository root with:
#
#   uv run --project tests/sleeptracker --locked \
#     pytest -c tests/sleeptracker/pytest.ini tests/sleeptracker
#
# The integration itself has no Python requirements beyond Home Assistant
# (manifest.json `requirements` is empty). The one direct dependency here is
# the custom-component test harness; each of its releases pins the Home
# Assistant version it was built for, so moving this pin moves the Home
# Assistant the tests run against. Dependabot proposes the updates.
#
# This is not a package: `tool.uv.package = false` keeps uv from building or
# installing anything from this directory.
[project]
name = "sleeptracker-tests"
version = "0.0.0"
description = "Test environment for the Sleeptracker Home Assistant integration"
requires-python = ">=3.14.2"
dependencies = [
  "pytest-homeassistant-custom-component==0.13.375",
]

[tool.uv]
package = false
